[package]
name = "app"
version = "0.1.0"
edition = "2024"
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
app_macros.workspace = true
anyhow.workspace = true
async-trait.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
dotenv.workspace = true
http.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
log.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true


icons.workspace = true
leptos_ui.workspace = true
pwhash.workspace = true
serde.workspace = true
strum.workspace = true
strum_macros.workspace = true
time.workspace = true
tw_merge.workspace = true
web-sys.workspace = true

# Needed for getrandom@0.2.x dependencies (pwhash, axum_session, sqlx, etc.) on wasm32 target
# See .cargo/config.toml
getrandom.workspace = true


# ACCESS CONTROL
itertools.workspace = true
serde_json.workspace = true
sha2.workspace = true
convert_case.workspace = true




axum = { workspace = true, optional = true }
axum_session = { workspace = true, optional = true }
axum_session_auth = { workspace = true, optional = true }
axum_session_sqlx = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }


[features]
default = ["csr"]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
ssr = [
    "dep:axum",
    "dep:axum_session",
    "dep:axum_session_auth",
    "dep:axum_session_sqlx",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
