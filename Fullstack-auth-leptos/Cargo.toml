[workspace]
resolver = "2"
members = ["app", "server", "tests"]

[workspace.dependencies]
app_macros = { path = "crates/macros" }
icons = { version = "0.15", features = ["leptos"] }
leptos_ui = "0.3"


anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-macros = "0.5"
axum_session = "0.16"
axum_session_auth = "0.16"
axum_session_sqlx = "0.5"
console_error_panic_hook = "0.1"
console_log = "1"
dotenv = "0.15"
http = "1"
leptos = { version = "0.8", features = ["nightly"] }
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = { version = "0.8", features = ["nightly"] }
log = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "time", "json"] }
thiserror = "2"
tokio = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", default-features = false, features = ["v4", "v7", "js", "serde"] }
wasm-bindgen = "0.2"


pwhash = "1"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
time = { version = "0.3", features = ["serde"] }
tw_merge = { version = "0.1", features = ["variant", "debug"]}
web-sys = "0.3"


# Needed for getrandom@0.2.x dependencies (pwhash, axum_session, sqlx, etc.) on wasm32 target
# TODO 🚑. See .cargo/config.toml
getrandom = { version = "0.2.15", features = ["js"] }


# ACCESS CONTROL
itertools = "0.14"
serde_json = "1"
sha2 = "0.10"
convert_case = "0.6"




[[workspace.metadata.leptos]]
name = "w5_d23_fullstack_auth"
bin-package = "server"
lib-package = "app"
site-root = "target/site"
assets-dir = "public"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = []
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

